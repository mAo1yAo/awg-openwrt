- name: Collect and Upload
        run: |
          echo "=== 查找所有ipk ==="
          find /home/runner/work -name "*.ipk" 2>/dev/null | sort
          echo "=== 查找amnezia相关 ==="
          find /home/runner/work -name "*amnezia*" 2>/dev/null | sort
          find /home/runner/work -name "*awg*" 2>/dev/null | sort

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: awg-packages
          path: /home/runner/work/**/*.ipk
          if-no-files-found: warn
          retention-days: 7
