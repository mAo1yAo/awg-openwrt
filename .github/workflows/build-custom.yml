name: Build AWG for LEDE R24.11.11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl python3

      - name: Clone OpenWrt at exact commit
        run: |
          git clone https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout d1129c83f

      - name: Add AWG feed
        run: |
          cd openwrt
          echo "src-git amneziawg https://github.com/Slava-Shchipunov/awg-openwrt.git" \
            >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p amneziawg

      - name: Configure
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=m
          CONFIG_PACKAGE_luci-proto-amneziawg=m
          EOF
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j4 V=s 2>&1 | tail -20

      - name: Build packages
        run: |
          cd openwrt
          make package/feeds/amneziawg/kmod-amneziawg/compile -j$(nproc) V=s
          make package/feeds/amneziawg/amneziawg-tools/compile -j$(nproc) V=s
          make package/feeds/amneziawg/luci-proto-amneziawg/compile -j$(nproc) V=s

      - name: Collect packages
        run: |
          find openwrt/bin -name "*.ipk" | grep -iE "amnezia|kmod-amnezia"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: awg-lede-r24.11.11-x86_64
          path: openwrt/bin/**/*amnezia*.ipk
          retention-days: 7
