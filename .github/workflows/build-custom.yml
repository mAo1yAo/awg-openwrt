name: Build AWG for ImmortalWrt 24.10.6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl python3 \
            libelf-dev

      - name: Clone ImmortalWrt
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          git checkout cf234f8de6d5
          git log --oneline -1

      - name: Add AWG feed
        run: |
          cd immortalwrt
          echo "src-git amneziawg https://github.com/Slava-Shchipunov/awg-openwrt.git" \
            >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p amneziawg

      - name: Configure
        run: |
          cd immortalwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=m
          CONFIG_PACKAGE_luci-proto-amneziawg=m
          CONFIG_PACKAGE_kmod-wireguard=m
          CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=m
          CONFIG_PACKAGE_kmod-crypto-lib-chacha20=m
          CONFIG_PACKAGE_kmod-crypto-lib-poly1305=m
          CONFIG_PACKAGE_kmod-crypto-lib-curve25519=m
          CONFIG_PACKAGE_kmod-crypto-hash=m
          CONFIG_PACKAGE_kmod-crypto-hmac=m
          CONFIG_PACKAGE_kmod-crypto-kpp=m
          CONFIG_PACKAGE_kmod-udptunnel4=m
          CONFIG_PACKAGE_kmod-udptunnel6=m
          EOF
          make defconfig

      - name: Download sources
        run: |
          cd immortalwrt
          make download -j4 2>&1 | tail -20

      - name: Build host tools
        run: |
          cd immortalwrt
          make tools/install -j$(nproc) V=s 2>&1 | tail -10

      - name: Build toolchain
        run: |
          cd immortalwrt
          make toolchain/install -j$(nproc) V=s 2>&1 | tail -10

      - name: Build kernel (full modules)
        run: |
          cd immortalwrt
          make target/compile -j$(nproc) V=s 2>&1 | tail -40

      - name: Build kernel module packages
        run: |
          cd immortalwrt
          make package/kernel/linux/compile -j$(nproc) V=s 2>&1 | tail -40

      - name: Build AWG packages
        run: |
          cd immortalwrt
          make package/feeds/amneziawg/kmod-amneziawg/compile -j$(nproc) V=s 2>&1 | tail -30
          make package/feeds/amneziawg/amneziawg-tools/compile -j$(nproc) V=s 2>&1 | tail -20
          make package/feeds/amneziawg/luci-proto-amneziawg/compile -j$(nproc) V=s 2>&1 | tail -20 || true

      - name: Collect
        run: |
          echo "=== 内核版本 hash ==="
          cat immortalwrt/build_dir/target-x86_64_musl/linux-x86_64/linux-6.6.*/.vermagic 2>/dev/null || true
          echo "=== amnezia 包 ==="
          find immortalwrt/bin -name "*amnezia*.ipk" -exec ls -lh {} \;
          echo "=== 依赖包 ==="
          find immortalwrt/bin -name "*crypto-lib*.ipk" -o -name "*udptunnel*.ipk" | sort

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: awg-immortalwrt-24.10.6-x86_64
          path: |
            immortalwrt/bin/**/*amnezia*.ipk
            immortalwrt/bin/**/*crypto-lib*.ipk
            immortalwrt/bin/**/*udptunnel*.ipk
          if-no-files-found: warn
          retention-days: 7
