name: Build AWG for ImmortalWrt 24.10.6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl python3 \
            libelf-dev

      - name: Clone ImmortalWrt
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          git checkout v24.10.6
          git log --oneline -1

      - name: Add AWG feed
        run: |
          cd immortalwrt
          echo "src-git amneziawg https://github.com/Slava-Shchipunov/awg-openwrt.git" \
            >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p amneziawg

      - name: Configure
        run: |
          cd immortalwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=m
          CONFIG_PACKAGE_luci-proto-amneziawg=m
          EOF
          make defconfig
          echo "=== 确认依赖已传导到内核配置 ==="
          grep -E "CONFIG_PACKAGE_kmod-crypto|CONFIG_PACKAGE_kmod-udptunnel" .config || true

      - name: Download sources
        run: |
          cd immortalwrt
          make download -j4 2>&1 | tail -20

      - name: Build host tools
        run: |
          cd immortalwrt
          make tools/install -j$(nproc) V=s 2>&1 | tail -10

      - name: Build toolchain
        run: |
          cd immortalwrt
          make toolchain/install -j$(nproc) V=s 2>&1 | tail -10

      - name: Build kernel (full modules)
        run: |
          cd immortalwrt
          make target/compile -j$(nproc) V=s 2>&1 | tail -40

      - name: Build all packages
        run: |
          cd immortalwrt
          make package/compile -j$(nproc) V=s 2>&1 | tail -60 || true

      - name: Collect
        run: |
          echo "=== amnezia 相关包 ==="
          find immortalwrt/bin -name "*amnezia*.ipk" | sort
          find immortalwrt/bin -name "*amnezia*.ipk" -exec ls -lh {} \;
          echo "=== 依赖的 crypto/udptunnel 包 ==="
          find immortalwrt/bin -name "*crypto-lib*.ipk" -o -name "*udptunnel*.ipk" | sort

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: awg-immortalwrt-24.10.6-x86_64
          path: |
            immortalwrt/bin/**/*amnezia*.ipk
          if-no-files-found: warn
          retention-days: 7
