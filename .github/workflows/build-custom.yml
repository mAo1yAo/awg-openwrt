name: Build AWG for LEDE R24.11.11 x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build kmod-amneziawg
        run: |
          OPENWRT_VERSION="d1129c83f"
          TARGET="x86"
          SUBTARGET="64"
          
          # 安装依赖
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl
          
          # 克隆 OpenWrt 源码，指定 commit
          git clone https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout d1129c83f
          
          # 添加 AWG feeds
          echo "src-git amneziawg https://github.com/Slava-Shchipunov/awg-openwrt.git" \
            >> feeds.conf.default
          
          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 配置
          echo "CONFIG_TARGET_x86=y" > .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=m" >> .config
          echo "CONFIG_PACKAGE_luci-proto-amneziawg=m" >> .config
          
          make defconfig
          
          # 下载源码
          make download -j4
          
          # 只编译需要的包
          make package/kmod-amneziawg/compile -j$(nproc) V=s
          make package/amneziawg-tools/compile -j$(nproc) V=s
          make package/luci-proto-amneziawg/compile -j$(nproc) V=s
          
          # 收集编译结果
          find bin/packages -name "*.ipk" | grep -E "amnezia"
          find bin/targets -name "*.ipk" | grep -E "amnezia|kmod"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awg-packages-lede-r24.11.11
          path: |
            openwrt/bin/**/*amnezia*.ipk
            openwrt/bin/**/*kmod-amnezia*.ipk
          retention-days: 7
