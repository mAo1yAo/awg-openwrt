name: Build ImmortalWrt 24.10.6 with AWG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl python3 \
            libelf-dev

      - name: Clone ImmortalWrt
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          git checkout v24.10.6
          git log --oneline -1

      - name: Add AWG feed
        run: |
          cd immortalwrt
          echo "src-git amneziawg https://github.com/Slava-Shchipunov/awg-openwrt.git" \
            >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p amneziawg

      - name: Configure
        run: |
          cd immortalwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_GRUB_IMAGES=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_PACKAGE_kmod-amneziawg=y
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=y
          CONFIG_PACKAGE_kmod-crypto-lib-curve25519=y
          CONFIG_PACKAGE_kmod-udptunnel4=y
          CONFIG_PACKAGE_kmod-udptunnel6=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_curl=y
          EOF
          make defconfig

      - name: Download sources
        run: |
          cd immortalwrt
          make download -j4 2>&1 | tail -20

      - name: Build firmware
        run: |
          cd immortalwrt
          make -j$(nproc) IGNORE_ERRORS=1 BUILD_LOG=1 V=s 2>&1 | tail -20
          echo "=========================================="
          echo "=== 编译失败的包 ==="
          grep -rl "ERROR" logs/ 2>/dev/null | head -20 || true
          grep -E "failed to build" /dev/null 2>/dev/null || true

      - name: Build image
        run: |
          cd immortalwrt
          make target/install -j$(nproc) V=s 2>&1 | tail -40
          echo "=== 镜像文件 ==="
          find bin -name "*.img.gz" 2>/dev/null

      - name: Show kernel hash
        run: |
          cd immortalwrt
          echo "=== 内核 vermagic ==="
          find build_dir -name ".vermagic" -exec cat {} \;

      - name: Collect
        run: |
          cd immortalwrt
          find bin -name "*.img.gz" 2>/dev/null
          find bin -name "*amnezia*.ipk" 2>/dev/null

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-awg-firmware
          path: |
            immortalwrt/bin/targets/x86/64/*.img.gz
            immortalwrt/bin/targets/x86/64/*.iso
          if-no-files-found: warn
          retention-days: 7
